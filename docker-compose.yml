services:
  current:
    # Built and published by GitHub Actions on every merge to main
    # (.github/workflows/docker-image.yml). To build from this checkout instead:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/jray222/current:latest
    pull_policy: always
    container_name: current
    shm_size: "512mb"
    ports:
      - "5734:5734"
    environment:
      # See backend/.env.example for every option.
      APP_ENV: development          # set to "production" when served over HTTPS (secure cookies + HSTS)
      FRONTEND_ORIGIN: http://localhost:5734
      # Behind Cloudflare / your own domain (see README "Hosting behind Cloudflare"):
      # PUBLIC_URL: https://current.example.com
      # TRUST_PROXY_HEADERS: "true"
      # Time zone of the container; daily crawls run at scheduled local time.
      TZ: ${TZ:-America/Indiana/Indianapolis}
      # True: anyone can sign up and gets their own household. False: invite-only
      # after the first account (the first account is always allowed and becomes the owner).
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # Sent with outbound crawler requests: Current/0.1 (+PUBLIC_URL; CRAWLER_CONTACT)
      CRAWLER_CONTACT: ${CRAWLER_CONTACT:-https://github.com/jray222/current}
      # Optional, for batch article categorization with Claude; you can also paste the key in Settings -> AI.
      # ANTHROPIC_API_KEY: sk-ant-...
      # SECRET_KEY: set one here, or let Current generate and persist it in the volume.
    volumes:
      - current-data:/app/backend/data
    restart: unless-stopped

volumes:
  current-data:
