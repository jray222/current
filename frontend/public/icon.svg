<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0a1420" flood-opacity="0.45"/>
    </filter>
    <filter id="bolt-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0a1420" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background brand-700 -->
  <rect width="512" height="512" fill="#1F3A5F"/>

  <!-- Folded Newspaper -->
  <g filter="url(#shadow)">
    <!-- Back sheet offset slightly -->
    <rect x="138" y="86" width="250" height="320" rx="20" fill="#E5E1D8" opacity="0.7" transform="rotate(-3 256 256)"/>
    <!-- Main page in cream -->
    <rect x="131" y="96" width="250" height="320" rx="20" fill="#F6F4EF"/>
    <!-- Fold crease line -->
    <line x1="131" y1="256" x2="381" y2="256" stroke="#D8D4C8" stroke-width="2.5" stroke-dasharray="6 4"/>
    <!-- Masthead -->
    <rect x="157" y="124" width="198" height="24" rx="6" fill="#1F3A5F"/>
    <!-- Columns top -->
    <rect x="157" y="162" width="92" height="12" rx="4" fill="#8FAED1"/>
    <rect x="157" y="184" width="92" height="12" rx="4" fill="#8FAED1"/>
    <rect x="157" y="206" width="70" height="12" rx="4" fill="#8FAED1"/>
    <rect x="157" y="228" width="85" height="12" rx="4" fill="#8FAED1"/>
    <rect x="263" y="162" width="92" height="12" rx="4" fill="#8FAED1"/>
    <rect x="263" y="184" width="92" height="12" rx="4" fill="#8FAED1"/>
    <rect x="263" y="206" width="92" height="12" rx="4" fill="#8FAED1"/>
    <rect x="263" y="228" width="65" height="12" rx="4" fill="#8FAED1"/>
    <!-- Columns bottom -->
    <rect x="157" y="274" width="92" height="12" rx="4" fill="#8FAED1"/>
    <rect x="157" y="296" width="75" height="12" rx="4" fill="#8FAED1"/>
    <rect x="157" y="318" width="92" height="12" rx="4" fill="#8FAED1"/>
    <rect x="157" y="340" width="85" height="12" rx="4" fill="#8FAED1"/>
    <rect x="263" y="274" width="92" height="12" rx="4" fill="#8FAED1"/>
    <rect x="263" y="296" width="92" height="12" rx="4" fill="#8FAED1"/>
    <rect x="263" y="318" width="92" height="12" rx="4" fill="#8FAED1"/>
    <rect x="263" y="340" width="70" height="12" rx="4" fill="#8FAED1"/>
    <rect x="157" y="370" width="198" height="14" rx="4" fill="#5F8BBC"/>
  </g>

  <!-- Electric Current Lightning Bolt (volt) -->
  <g filter="url(#bolt-shadow)">
    <path d="M 315 60 L 225 220 L 295 220 L 195 452 L 285 268 L 220 268 Z"
          fill="#F5C518"
          stroke="#14253C"
          stroke-width="12"
          stroke-linejoin="round"
          stroke-linecap="round"/>
  </g>
</svg>
